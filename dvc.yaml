# ── DVC Pipeline Definition ─────────────────────────────────────────────────
# Run stages: dvc repro
# Visualize DAG: dvc dag

stages:

  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
    outs:
      - data/raw/churn_raw.csv

  preprocessing:
    cmd: python src/preprocessing.py
    deps:
      - src/preprocessing.py
      - data/raw/churn_raw.csv
    outs:
      - data/processed/X_train.csv
      - data/processed/X_val.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_val.csv
      - data/processed/y_test.csv

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/processed/X_train.csv
      - data/processed/y_train.csv
    outs:
      - data/processed/X_train_smote.csv
      - data/processed/y_train_smote.csv
      - data/processed/X_val_scaled.csv
      - data/processed/X_test_scaled.csv
      - models/scaler.pkl

  training:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/X_train_smote.csv
      - data/processed/y_train_smote.csv
    outs:
      - models/best_model.pkl
      - models/feature_columns.pkl
    metrics:
      - reports/metrics.json:
          cache: false

  evaluation:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/best_model.pkl
      - data/processed/X_test_scaled.csv
      - data/processed/y_test.csv
    metrics:
      - reports/test_metrics.json:
          cache: false
    plots:
      - reports/roc_curve.csv:
          cache: false
