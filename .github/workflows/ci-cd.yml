name: CI/CD — Churn MLOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: churn-mlops-api
  PYTHON_VERSION: "3.9"

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint + Test
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          flake8 api/ src/ tests/ \
            --max-line-length=120 \
            --exclude=__pycache__,.git \
            --ignore=E501,W503

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=api --cov-report=term-missing

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build Docker Image
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create dummy model files (for build test)
        run: |
          mkdir -p models
          python -c "
          import pickle, numpy as np
          from sklearn.ensemble import GradientBoostingClassifier
          from sklearn.preprocessing import StandardScaler

          X = np.random.rand(100, 9)
          y = np.random.randint(0, 2, 100)
          model = GradientBoostingClassifier(n_estimators=5).fit(X, y)
          scaler = StandardScaler().fit(X)
          cols = ['gender','SeniorCitizen','Partner','Dependents','tenure',
                  'PhoneService','PaperlessBilling','MonthlyCharges','TotalCharges']

          pickle.dump(model,  open('models/best_model.pkl',      'wb'))
          pickle.dump(scaler, open('models/scaler.pkl',          'wb'))
          pickle.dump(cols,   open('models/feature_columns.pkl', 'wb'))
          print('✅ Dummy models created')
          "

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name test-api ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 8
          curl --retry 5 --retry-delay 2 -f http://localhost:8000/health
          docker stop test-api

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Push to DockerHub (only on main branch push)
  # ────────────────────────────────────────────────────────────────────────────
  push:
    name: 📦 Push to DockerHub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Deploy to AWS EC2 (only on main branch push)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/churn-mlops-api:latest
            docker stop churn-api 2>/dev/null || true
            docker rm   churn-api 2>/dev/null || true
            docker run -d -p 8000:8000 --name churn-api \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/churn-mlops-api:latest
            echo "✅ Deployed successfully"
